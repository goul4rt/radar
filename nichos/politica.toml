# Arquitetura de Confiança Zero para Jornalismo Institucional
# Mapeamento com feeds nativos confirmados e fallbacks via Google News (anti-WAF)
# =====================================================================

nome = "Política Brasil"
descricao = "Fontes primárias oficiais de Brasília, tribunais superiores e alertas de apuração política."

[papeis]
primaria = "Decisão judicial, ato oficial ou documento público original (TSE, STF, Planalto, DOU, Congresso)"
alerta = "Grandes veículos de imprensa e apuração que sinalizam acontecimentos"
