# =====================================================================
# radar/nichos/politica-ampliado.toml
# Complemento de política: imprensa nacional de todo o espectro,
# blogs de bastidor, checagem, jurídico, votações do Congresso e MT ampliado.
#
# Legenda:
#   NATIVO-CONFIRMADO = RSS nativo validado em 2026
#   FALLBACK GN       = Google News proxy (sempre devolve XML estruturado)
#   espectro          = centro / direita / esquerda / investigativo
#
# Regra do @fato.colado: opiniões e bastidores ficam com peso calibrado
# (0.5 a 0.8), checagens e investigativos (0.9 a 1.0), fontes primárias (1.3 a 1.5).
# =====================================================================

nome = "Política Brasil (ampliado)"
descricao = "Imprensa nacional de todo o espectro, blogs e colunas políticas, checagem de fatos, votações e Mato Grosso ampliado."

[papeis]
primaria = "Decisão judicial, ato oficial, votação nominal ou documento original"
alerta = "Grandes veículos de imprensa, investigação, checagem e blogs"
regional = "Notícias institucionais e políticas de Mato Grosso e Cuiabá"

