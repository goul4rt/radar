# Nicho: anime, mangá e dublagem (Shinbun). Copie este arquivo para criar outro nicho.
# papel: primaria (fonte que se cita) · alerta (avisa que saiu algo; confirmar na primária)
#        brasil (contexto "No Brasil:") · concorrente (só mede quem chegou antes)
nome = "Anime, mangá e dublagem"
descricao = "Fontes japonesas primárias, alertas em inglês, Brasil (editoras, Crunchyroll, dublagem) e concorrentes BR."

[papeis]
primaria = "Fonte japonesa que se cita no post."
alerta = "Alertas em inglês; confirmar na primária antes de postar."
brasil = "Contexto do No Brasil: editoras, streaming, dublagem."
concorrente = "Perfis BR concorrentes; medem quem chegou antes."


[[feed]]
nome = "Anime News Network"
url = "https://www.animenewsnetwork.com/newsroom/rss.xml?ann-edition=us"
lingua = "en"
peso = 1.0
papel = "alerta"

